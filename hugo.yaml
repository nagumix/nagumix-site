title: &siteTitle NaguMIX
baseURL: https://example.invalid/
defaultContentLanguage: en
disableLanguages: [zh, fr]
enableGitInfo: false
enableRobotsTXT: true
enableEmoji: true
timeZone: UTC

languages:
  en:
    label: English
    locale: en-US
    weight: 1
    title: *siteTitle
    params:
      description: Arrange images, explore layouts and export collages with NaguMIX.
  zh:
    label: 简体中文
    locale: zh-CN
    weight: 2
    title: *siteTitle
    hasCJKLanguage: true
    params:
      description: NaguMIX project documentation.
  fr:
    label: Français
    locale: fr-FR
    weight: 3
    title: *siteTitle
    params:
      description: NaguMIX project documentation.

markup:
  goldmark:
    renderer:
      unsafe: true
    parser:
      attribute:
        block: true
      wrapStandAloneImageWithinParagraph: false
  highlight:
    noClasses: false

outputs:
  home: [HTML, RSS, markdown, LLMS]
  page: [HTML, markdown]
  section: [HTML, RSS, print, markdown]

menus:
  main:
    - name: Home
      pageRef: /
      weight: 10
    - name: FAQ
      url: /#faq
      weight: 40

params:
  offline_search: true
  copyright:
    authors: Vangual
    from_year: 2025
    to_year: 2026
  footer_center_info: ''
  ui:
    dark_mode: true
    section_index: cards
    sidebar_menu_foldable: true
    sidebar_icon_policy: groups
    backlinks: true
    typography: system

module:
  imports:
    - path: github.com/pgsty/oink
  hugoVersion:
    extended: true
    min: 0.160.1
