sections: [hero, cards]

hero:
  align: center
  eyebrow: Image collage application
  title_lines:
    - words: [{ text: Arrange images. }]
    - words: [{ text: Keep the view. }]
  lead: NaguMIX is a native desktop application for arranging, cropping, saving, and exporting image collages.
  actions:
    - { label: Project status, url: docs/status/, icon: fa-solid fa-circle-info, style: primary }
    - { label: About NaguMIX, url: docs/overview/, icon: fa-solid fa-image, style: ghost }

cards:
  eyebrow: Documentation scaffold
  title: What is available now
  columns: 3
  items:
    - title: Application
      desc: A native wxPython canvas for still images and animated GIFs.
      icon: fa-solid fa-display
      url: docs/overview/
    - title: Documentation
      desc: The public user guide and project documentation will grow here.
      icon: fa-solid fa-book-open
      url: docs/
    - title: Availability
      desc: Downloads and public source links are not published yet.
      icon: fa-solid fa-circle-info
      url: docs/status/
